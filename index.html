<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>🏆 德州荣耀</title>
<style>
  :root{ --gold:#FFC700; --bg:#0e0e10; --card:#1a1a1d; --line:#2a2a2e; --txt:#f2f2f5; --sub:#9a9aa0; --green:#34c759; }
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:680px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:6px 0 2px} .sub{color:var(--sub);font-size:13px;margin-bottom:10px}
  .search{display:block;width:100%;padding:10px 14px;margin:0 0 14px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--txt);font-size:15px;outline:none;-webkit-appearance:none}
  .search:focus{border-color:var(--gold)} .search::placeholder{color:var(--sub)}
  .empty{color:var(--sub);text-align:center;padding:24px;display:none}
  table{width:100%;border-collapse:collapse} thead th{color:var(--sub);font-weight:600;font-size:12px;text-align:right;padding:6px 8px}
  thead th.l{text-align:left} thead th{white-space:nowrap}
  tbody tr{background:var(--card);cursor:pointer} tbody tr:active{filter:brightness(1.25)}
  /* rank-tier row tints (mirror the desktop app: 前7 金区, 8-12 红灯区) */
  tbody tr.rk-gold{background:#2c2818} tbody tr.rk-red{background:#2e1818}
  td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:15px}
  td.rank{width:30px;color:var(--sub);text-align:center;font-weight:700}
  td.name{text-align:left;font-weight:600;width:100%;max-width:0} .top1 td.rank{color:var(--gold)}
  td.pts{color:var(--green);font-weight:700} td.coins{color:var(--gold);font-weight:700}
  td.stix{color:#C4A5FF;font-weight:700;white-space:nowrap}
  .fhw{font-size:.7em;font-weight:600;opacity:.85}
  .chev{color:var(--sub);font-size:12px;margin-left:4px}
  /* detail */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10}
  .sheet{position:fixed;inset:0;overflow:auto;background:var(--bg);display:none;z-index:11;-webkit-overflow-scrolling:touch}
  .sheet.open,.overlay.open{display:block}
  .shead{position:sticky;top:0;background:var(--bg);padding:14px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;z-index:2}
  .back{font-size:22px;color:var(--gold);background:none;border:none;cursor:pointer;padding:0 4px}
  .shead h2{font-size:19px;margin:0;flex:1}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;padding:14px 16px}
  .stat{background:var(--card);border-radius:12px;padding:12px 6px;text-align:center;min-width:0}
  .stat .v{font-size:22px;font-weight:800;white-space:nowrap} .stat .k{color:var(--sub);font-size:12px;margin-top:2px;white-space:nowrap}
  .stat.coins .v{color:var(--gold)} .stat.pts .v{color:var(--green)} .stat.stix .v{color:#C4A5FF}
  .cat{padding:16px 16px 4px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line);margin:0 0 0}
  .cat.has{color:#e8e8ed} .cat.none{color:#5a5a5e}
  .grid{padding:6px 10px 2px}
  .badge{display:flex;align-items:center;gap:15px;padding:14px 6px;border-bottom:1px solid #1f1f23}
  .badge img{width:96px;height:96px;flex:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.6)) drop-shadow(0 12px 22px rgba(0,0,0,.55)) drop-shadow(0 0 8px rgba(190,196,208,.32));
    transition:transform .12s ease}
  .badge img:active{transform:scale(.9)}
  .badge.rare img{filter:drop-shadow(0 3px 4px rgba(0,0,0,.6)) drop-shadow(0 12px 22px rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(90,200,250,.65))}
  .badge.legendary img{filter:drop-shadow(0 3px 4px rgba(0,0,0,.6)) drop-shadow(0 12px 22px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(255,199,0,.75))}
  .badge.locked img{filter:grayscale(1) brightness(.5) drop-shadow(0 4px 7px rgba(0,0,0,.5));opacity:.5}
  .bi{flex:1;min-width:0}
  .bn{font-weight:700;font-size:15px} .badge.locked .bn{color:#9a9aa0}
  .bd{color:var(--sub);font-size:12px;margin-top:1px;line-height:1.35}
  .bp{font-size:12px;margin-top:3px} .bp.done{color:var(--green);font-weight:700} .bp.prog{color:var(--gold)}
  .chip{font-size:11px;border-radius:6px;padding:1px 7px;font-weight:700}
  .r-common{background:rgba(192,192,197,.18);color:#c8c8cd} .r-rare{background:rgba(90,200,250,.18);color:#5ac8fa}
  .r-legendary{background:rgba(255,199,0,.18);color:var(--gold)}
  .foot{color:#55555c;font-size:11px;text-align:center;padding:18px}
  .xcount{font-size:12px;color:var(--gold);font-weight:700;margin-left:6px}
  /* row avatar */
  td.name .nmcell{display:flex;align-items:center;gap:10px}
  .rava{width:32px;height:32px;border-radius:50%;flex:none;background-size:cover;background-position:center 12%;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .nmtxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* phones: everything on one screen width — tighter cells, text-only headers, no '/35' */
  @media (max-width:520px){
    .wrap{padding:14px 10px}
    thead th{padding:6px 4px;font-size:11px} td{padding:10px 4px;font-size:14px}
    td.rank{width:22px} td.name .nmcell{gap:7px} .rava{width:28px;height:28px}
    .thi,.bdg-of,td.name .chev{display:none}
    td.stix{padding-left:9px} .fhw{font-size:.62em}
    .stats{padding:12px 10px}
  }
  /* character-card detail hero */
  .cback{position:fixed;top:12px;left:12px;z-index:13;width:38px;height:38px;border-radius:50%;border:none;
    background:rgba(0,0,0,.45);color:#fff;font-size:23px;line-height:1;cursor:pointer;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .phero{position:relative;width:100%;background:#0a0a0c}
  /* 动态图卡: 圆角卡片 + 外圈呼吸光晕 + 沿边框转圈的光带 + 斜扫流光 + 跟手高光 + 闪烁光点。
     除了光晕(box-shadow)外全是 transform/opacity 动画, 交给 GPU 合成, 手机上也不卡。 */
  .phero.card{overflow:hidden;aspect-ratio:1/1;max-height:60vh;width:auto;margin:10px 10px 0;border-radius:18px;
    isolation:isolate;animation:phglow 4.6s ease-in-out infinite}
  @keyframes phglow{0%,100%{box-shadow:0 0 18px -6px var(--pc,#FFC700),inset 0 -70px 90px -50px var(--pc,#FFC700)}
    50%{box-shadow:0 0 30px -4px var(--pc,#FFC700),inset 0 -70px 132px -44px var(--pc,#FFC700)}}
  .phwrap{position:absolute;inset:-6%;z-index:0;will-change:transform;transition:transform .12s ease-out}
  .pheroimg{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block;
    animation:phbreathe 6s ease-in-out infinite;will-change:transform}
  @keyframes phbreathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.025)}}
  .phsweep{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;mix-blend-mode:screen}
  .phsweep::before{content:'';position:absolute;top:-40%;bottom:-40%;left:0;width:48%;
    background:linear-gradient(90deg,transparent 0%,rgba(255,120,210,.16) 30%,rgba(255,255,255,.55) 50%,
      rgba(110,220,255,.18) 70%,transparent 100%);
    transform:translateX(-130%) rotate(16deg);animation:phsweep 5.5s cubic-bezier(.45,.05,.35,1) infinite}
  @keyframes phsweep{0%{transform:translateX(-130%) rotate(16deg)}30%,100%{transform:translateX(330%) rotate(16deg)}}
  .phglare{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .35s;mix-blend-mode:screen;
    background:radial-gradient(circle at var(--gx,50%) var(--gy,35%),rgba(255,255,255,.34),rgba(255,255,255,0) 58%)}
  .phero.hov .phglare{opacity:1}
  .phvig{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(6,6,8,.55) 0%,rgba(6,6,8,0) 26%,
    rgba(6,6,8,0) 48%,rgba(6,6,8,.9) 100%)}
  .phparts{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none}
  .phparts i{position:absolute;bottom:-14px;opacity:0;animation:phdrift linear infinite}
  .phparts i::before{content:'';position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle,#fff 0 18%,var(--pc,#FFC700) 40%,rgba(0,0,0,0) 70%);
    animation:phtwinkle 1.5s ease-in-out infinite alternate}
  @keyframes phdrift{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(-360px);opacity:0}}
  @keyframes phtwinkle{from{opacity:.5;transform:translateX(-3px) scale(.72)}to{opacity:1;transform:translateX(3px) scale(1.12)}}
  .phring{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;padding:3px;overflow:hidden;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask-composite:exclude}
  .phring::before{content:'';position:absolute;inset:0;background:var(--pc,#FFC700);opacity:.42}
  .phring::after{content:'';position:absolute;left:50%;top:50%;width:160%;aspect-ratio:1/1;
    background:conic-gradient(#fff 0deg,var(--pc,#FFC700) 12deg,rgba(0,0,0,0) 75deg,rgba(0,0,0,0) 180deg,
      #fff 180deg,var(--pc,#FFC700) 192deg,rgba(0,0,0,0) 255deg,rgba(0,0,0,0) 360deg);
    transform:translate(-50%,-50%) rotate(0deg);animation:phspin 4.8s linear infinite}
  @keyframes phspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .phero.card,.pheroimg,.phsweep::before,.phring::after,.phparts i,.phparts i::before{animation:none}
    .phsweep,.phparts{display:none}
  }
  /* B 闪卡: 金属卡框(9 宫格) + 小小的稀有度字牌(不标星) + 背景上的全息闪膜 + 人物背后主题色光柱,
     人物和背景分两层做视差; 手热(♨️/🔥)的人卡外面一圈火(canvas, 序列帧火焰)。 */
  .pcwrap{position:relative;display:flow-root}   /* flow-root: 卡的上下留边不跟外面合并, 火冠才有地方画 */
  .pcwrap.fire .phero.card{margin:26px 22px 4px}
  #pfire{position:absolute;left:0;top:0;pointer-events:none;z-index:0;display:none}
  .pcwrap.fire #pfire{display:block}
  .phero.card.gacha{border-radius:12px;z-index:1}
  .phero.card.gacha .phwrap{inset:-3%}
  .phl{position:absolute;inset:0;will-change:transform;transition:transform .12s ease-out}
  .phl .pheroimg{position:absolute;inset:0}
  .phbgimg{animation:none !important}
  .phfoil{position:absolute;inset:0;mix-blend-mode:screen;opacity:.2;pointer-events:none;
    background:url(demo/fx/foil.webp) repeat;background-size:256px 256px;animation:foildrift 60s linear infinite}
  .phfoil::after{content:'';position:absolute;inset:0;background:inherit;background-size:256px 256px;opacity:1;
    -webkit-mask-image:linear-gradient(115deg,transparent 30%,#000 50%,transparent 70%);
    mask-image:linear-gradient(115deg,transparent 30%,#000 50%,transparent 70%);
    -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:110% 0;mask-position:110% 0;animation:foilsweep 8s cubic-bezier(.45,.05,.35,1) 1.2s infinite}
  @keyframes foildrift{to{background-position:300px 150px}}
  @keyframes foilsweep{0%{-webkit-mask-position:110% 0;mask-position:110% 0}
    14%,100%{-webkit-mask-position:-10% 0;mask-position:-10% 0}}
  .phpillar{position:absolute;left:50%;top:-4%;height:108%;width:46%;pointer-events:none;mix-blend-mode:screen;
    background:linear-gradient(90deg,transparent 0%,var(--pc,#FFC700) 30%,#fff 50%,var(--pc,#FFC700) 70%,transparent 100%);
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 62%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 62%,transparent 100%);
    filter:blur(10px);opacity:0;transform:translateX(-50%) scaleX(.12);
    animation:pillaropen .45s .05s ease-out forwards,pillarbreathe 3.7s ease-in-out .5s infinite}
  @keyframes pillaropen{to{transform:translateX(-50%) scaleX(1);opacity:.5}}
  @keyframes pillarbreathe{0%,100%{opacity:.42}50%{opacity:.6}}
  .phframe{position:absolute;inset:0;z-index:6;pointer-events:none;border-style:solid;border-color:transparent;
    border-width:var(--fw,60px);border-image-slice:120;border-image-width:var(--fw,60px);border-image-repeat:stretch}
  .phframe.sheen{-webkit-mask-image:linear-gradient(115deg,transparent 40%,#000 50%,transparent 60%);
    mask-image:linear-gradient(115deg,transparent 40%,#000 50%,transparent 60%);
    -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    filter:brightness(2.2) saturate(.6);mix-blend-mode:screen;-webkit-mask-position:110% 0;mask-position:110% 0;
    animation:foilsweep 8s cubic-bezier(.45,.05,.35,1) 2s infinite}
  .phbadge{position:absolute;z-index:7;height:6.5%;max-height:22px;left:var(--bl,16px);top:var(--bt,14px);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));animation:badgein .35s ease-out both}
  @keyframes badgein{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
  .phglint{position:absolute;z-index:8;width:22%;aspect-ratio:1/1;pointer-events:none;mix-blend-mode:screen;
    background:url(demo/fx/glint.webp) center/contain no-repeat;opacity:0;animation:glint .5s .42s ease-out both}
  @keyframes glint{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
  .phero.card.gacha .phover{padding:14px calc(var(--bl,16px) + 6px) calc(var(--bb,14px) + 10px)}
  .rkfire{font-size:.86em;margin-left:3px}
  /* 每档的闪法(像球星卡 / 宝可梦卡): N 哑光 · R 卡框反光 · SR 星空镭射 · SSR 金色碎闪 + 金光柱 + 编号
     · UR 彩虹超级折射(背景 + 卡框都流彩虹) + 满屏碎闪 + 编号。镭射跟着手指 / 鼠标 / 手机倾斜滑动。 */
  .phfoil{inset:-40px;transform:translate(calc(var(--hx,0)*60px),calc(var(--hy,0)*45px))}
  .r-SR .phfoil{background-image:url(demo/fx/holo_sr.webp);opacity:.3}
  .r-SSR .phfoil{background-image:url(demo/fx/holo_ssr.webp);opacity:.34}
  .r-UR .phfoil{background-image:url(demo/fx/holo_ur.webp);opacity:.4}
  .phrainbow{position:absolute;inset:-40px;pointer-events:none;mix-blend-mode:screen;opacity:.2;
    background:repeating-linear-gradient(115deg,#FF4D6D 0%,#FFB13B 8%,#FFF35C 16%,#4DFF9A 25%,#46C8FF 33%,#8A6BFF 41%,#FF4D6D 50%);
    background-size:200% 200%;transform:translate(calc(var(--hx,0)*90px),0);animation:rbflow 14s linear infinite}
  @keyframes rbflow{to{background-position:200% 0}}
  .phglitter{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
  .phglitter::before,.phglitter::after{content:'';position:absolute;inset:-30px;background:url(demo/fx/glitter.webp) repeat;
    background-size:128px 128px;animation:twinkle 2.7s ease-in-out infinite alternate;
    transform:translate(calc(var(--hx,0)*25px),calc(var(--hy,0)*25px))}
  .phglitter::after{background-position:64px 45px;animation-delay:-1.35s}
  @keyframes twinkle{from{opacity:.05}to{opacity:var(--ga,.7)}}
  .r-SR .phglitter{--ga:.35} .r-SSR .phglitter{--ga:.65} .r-UR .phglitter{--ga:.95}
  .r-SSR .phpillar{--pill:#FFD36A} .r-UR .phpillar{--pill:#ffffff}
  .phpillar{background:linear-gradient(90deg,transparent 0%,var(--pill,var(--pc,#FFC700)) 30%,#fff 50%,var(--pill,var(--pc,#FFC700)) 70%,transparent 100%)}
  .phrbframe{display:none}
  @supports (-webkit-mask-box-image: url(x.png) 1){
    .r-UR .phrbframe{display:block;position:absolute;inset:0;z-index:6;pointer-events:none;mix-blend-mode:color;opacity:.8;
      background:repeating-linear-gradient(115deg,#FF4D6D 0%,#FFB13B 8%,#FFF35C 16%,#4DFF9A 25%,#46C8FF 33%,#8A6BFF 41%,#FF4D6D 50%);
      background-size:200% 200%;animation:rbflow 9s linear infinite;
      -webkit-mask-box-image:url(demo/fx/frame_ur.png) 120 / var(--fw,60px) stretch}
  }
  .phtw{position:absolute;z-index:8;width:9%;aspect-ratio:1/1;pointer-events:none;mix-blend-mode:screen;
    background:url(demo/fx/glint.webp) center/contain no-repeat;opacity:0;transform:translate(-50%,-50%);
    animation:tw 2.2s ease-in-out infinite}
  @keyframes tw{0%,70%,100%{opacity:0;transform:translate(-50%,-50%) scale(.3)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .phserial{position:absolute;z-index:7;right:var(--br,16px);bottom:calc(var(--bb,14px) + 8px);
    padding:4px 12px;font:800 12px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:.6px;color:#26242A;
    background:url(demo/fx/serial_plate.png) center/100% 100% no-repeat;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  @media (prefers-reduced-motion:reduce){
    .phrainbow,.phglitter::before,.phglitter::after,.phrbframe,.phtw{animation:none}
    .phtw{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .phfoil,.phfoil::after,.phpillar,.phframe.sheen,.phbadge,.phglint{animation:none}
    .phpillar{opacity:.45;transform:translateX(-50%)} .phframe.sheen,.phglint{display:none}
  }
  .phover{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;z-index:4}
  .prk{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;padding:2px 9px;border-radius:6px;
    color:#1a1400;background:linear-gradient(135deg,#FFE070,var(--pc,#FFC700));box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .pnm{font-size:29px;font-weight:900;line-height:1.05;margin-top:6px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
  .pti{font-size:15px;font-weight:700;color:var(--pc,#FFC700);margin-top:2px;text-shadow:0 1px 8px rgba(0,0,0,.95)}
  .phead2{display:flex;align-items:center;gap:14px;padding:20px 16px 8px}
  .pinit{width:62px;height:62px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:800;color:#fff}
  .phead2 .pnm{font-size:25px;text-shadow:none;margin-top:4px}
  .tiers{padding:12px 16px 2px;display:flex;flex-direction:column;gap:7px}
  .tier{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:11px;padding:8px 12px}
  .tier .tn{font-size:12px;font-weight:900;width:48px;flex:none}
  .tier .tmid{flex:1;min-width:0}
  .tier .treq{font-size:10px;color:var(--sub);margin-bottom:4px}
  .tier .tbar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
  .tier .tbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#FFE070,var(--pc,#FFC700))}
  .tier .tval{font-size:11px;font-weight:800;flex:none;width:70px;text-align:right;color:var(--pc,#FFC700)}
  .tier.done .tval{color:var(--green)} .tier.done .tbar i{background:var(--green)}
  /* hi-res badge lightbox */
  .lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.84);display:none;
    align-items:center;justify-content:center;padding:28px;
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
  .lb.open{display:flex}
  .lbcard{max-width:380px;width:100%;text-align:center}
  .lbglow{position:relative;display:inline-block;line-height:0}
  .lbglow::before{content:'';position:absolute;inset:-26%;border-radius:50%;z-index:-1;
    background:radial-gradient(circle, var(--glow,rgba(255,255,255,.22)) 0%, transparent 62%);filter:blur(16px)}
  .lb img{width:76vw;max-width:340px;height:auto;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.88));animation:lbpop .26s cubic-bezier(.2,.9,.3,1.25)}
  .lb img.lg{filter:drop-shadow(0 18px 40px rgba(0,0,0,.88)) drop-shadow(0 0 32px rgba(255,199,0,.82))}
  .lb img.rr{filter:drop-shadow(0 18px 40px rgba(0,0,0,.88)) drop-shadow(0 0 30px rgba(90,200,250,.74))}
  @keyframes lbpop{from{transform:scale(.74);opacity:0}to{transform:scale(1);opacity:1}}

let DATA = null;
const RC = {common:'r-common', rare:'r-rare', legendary:'r-legendary'};
const RL = {common:'○ 普通', rare:'◆ 稀有', legendary:'★ 传奇'};
const BY_NAME = {};

// ---- login gate: the data is AES-256-GCM encrypted; the password decrypts it
// client-side (WebCrypto). Wrong password → decrypt throws → "密码错误". ----
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptBlob(blob, password){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
    {name:'PBKDF2'}, false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(blob.salt), iterations:blob.iter, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(blob.iv)}, key, b64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
const PW_TTL = 5 * 24 * 60 * 60 * 1000;   // remember the login for 5 days
async function unlock(answer, persist){
  // The answer is the decryption key — normalize (trim + lowercase) so it is
  // matched case-insensitively, exactly as gen_web.py does before encrypting.
  const key = (answer || '').trim().toLowerCase();
  let data; try { data = await decryptBlob(ENC, key); } catch(e){ return false; }
  DATA = data;
  DATA.players.forEach(p => { BY_NAME[p.name] = p; });
  // Persist on MANUAL entry only, with a fixed 5-day expiry — so the gate
  // re-appears once every 5 days. Auto-unlocks pass persist=false and keep
  // the original expiry (no sliding renewal).
  if (persist) {
    try { localStorage.setItem('dzry_auth', JSON.stringify({k: key, exp: Date.now() + PW_TTL})); } catch(e){}
  }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('wrap').style.display = '';

// 手热: 整张卡烧起来 —— 跟 app 同一套 Opus 火 (tools/make_fire_ring.py 离线做的 24 帧循环,
// 网页的卡是正方形, 用 web 那套)。卡边白热 → 黄 → 橙 → 红的卡通火舌, 上边和两个上角最高,
// 两侧往上卷, 下边一圈短火; 外面一层会呼吸的火光 + 加光闪烁 + 往上飞的火星。

const FIRE_RING = {HOT: {glow:'255,138,26', breathe:2.4, flick:.10, sparks:8, rise:1.0, speed:.55,
                         col:['255,242,196', '255,180,60', '255,122,16']},
                   BLAZING: {glow:'255,58,18', breathe:1.6, flick:.22, sparks:18, rise:1.5, speed:.9,

function ringMeta(kind){ return (((DATA && DATA.cardfx) || {}).ring || {})[kind] || null; }

  if (!ringImgs[kind]){

}
function ringReady(o){ return o && ['top', 'bot', 'side'].every(s => o[s].complete && o[s].naturalWidth); }
function fireNow(){ return fireStill ? 0 : (performance.now() - fireT0) / 1000; }
function rng32(seed){

// 卡四周留出火的位置: 上边最多 (火往上窜), 两侧次之, 下边最少 —— 按卡的实际宽度
function fireLayout(){

    const k = hero.offsetWidth / m.W;

  }
}
function stopFire(){

  const cv = document.getElementById('pfire');
  if (cv) { const c = cv.getContext('2d'); c && c.clearRect(0, 0, cv.width, cv.height); }
  const hero = document.getElementById('phero');

}
function startFire(kind){

  }

function fireCanvas(){
  const cv = document.getElementById('pfire'), wrap = document.getElementById('pcwrap');

  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)){

// 火光: 卡外一圈柔光 (上边伸得更高), 中间挖空 —— 每个尺寸只画一次
function ringHalo(kind, m, w, h, dpr){
  const key = 'halo' + kind + w + 'x' + h + '@' + dpr;
  if (fireCache[key]) return fireCache[key];
  const k = w / m.W, side = m.pad_side * k, top = m.pad_top * k, bot = m.pad_bot * k, r0 = m.r * k;

  const q = cv.getContext('2d');
  q.scale(dpr, dpr);
  const rr = (x, y, ww, hh, r) => { q.beginPath(); q.roundRect ? q.roundRect(x, y, ww, hh, r) : q.rect(x, y, ww, hh); };

    q.fillStyle = `rgba(${FIRE_RING[kind].glow},${(.085 * Math.pow(1 - u, 1.5)).toFixed(4)})`;

  g.addColorStop(.42, `rgba(${mid},.9)`); g.addColorStop(.68, `rgba(${edge},.43)`); g.addColorStop(1, `rgba(${edge},0)`);

function drawFire(t){
  const kind = fireKind, m = kind && ringMeta(kind);

  if (!cv || !hero || !ringReady(o)) return;
  const [c, dpr] = fireCanvas();
  const x = hero.offsetLeft, y = hero.offsetTop, w = hero.offsetWidth, h = hero.offsetHeight;
  if (w < 20 || h < 20) return;
  const F = FIRE_RING[kind], live = !!t, n = m.frames;
  const k = w / m.W, ox = m.pad_side * k, cb = m.corner * k;
  const TH = cb + m.pad_top * k, BH = cb + m.pad_bot * k, SW = m.side_w * k, SH = Math.max(1, h - 2 * cb), TW = w + 2 * ox;
  const fi = live ? (Math.floor(t * m.fps) + fireSeed) % n : (FIRE_STILL + fireSeed) % n;
  const th = o.top.naturalHeight / n, bh = o.bot.naturalHeight / n, sw = o.side.naturalWidth / n, half = Math.floor(sw / 2);

    c.drawImage(o.top, 0, fi * th, o.top.naturalWidth, th, x - ox, y + cb - TH, TW, TH);
    c.drawImage(o.bot, 0, fi * bh, o.bot.naturalWidth, bh, x - ox, y + h - cb, TW, BH);
    c.drawImage(o.side, fi * sw, 0, half, o.side.naturalHeight, x - ox, y + cb, SW, SH);
    c.drawImage(o.side, fi * sw + half, 0, sw - half, o.side.naturalHeight, x + w + ox - SW, y + cb, SW, SH);

  c.globalCompositeOperation = 'lighter';

  const fl = .5 + .5 * Math.sin(t * 15 + fireSeed) * Math.sin(t * 6.1 + 1.3 * fireSeed);

// 旧版退路 (素材缺失时): 序列帧火焰条沿卡片四边往外烧 —— 上边最高、两侧次之、下边最矮,
// 外加一圈火光和往上飘的火星。
const FIRE = {HOT: {edges:[.62,.42,.26], glow:'255,154,31', embers:6},
              BLAZING: {edges:[1,.70,.40], glow:'255,74,18', embers:14}};
const fireImgs = {};
let fireTimer = null, fireKind = null;
function fireImg(kind){
  if (!fireImgs[kind]){ const im = new Image(); im.src = 'demo/fx/fire_' + kind.toLowerCase() + '.webp'; fireImgs[kind] = im; }
  return fireImgs[kind];
}
function drawFireStrips(t){
  const kind = fireKind, img = kind && fireImg(kind);
  const cv = document.getElementById('pfire'), hero = document.getElementById('phero'), wrap = document.getElementById('pcwrap');
  if (!kind || !cv || !hero || !img || !img.complete || !img.naturalWidth) return;
  const F = FIRE[kind], dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = wrap.clientWidth, H = wrap.clientHeight;
  if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  const x = hero.offsetLeft, y = hero.offsetTop, w = hero.offsetWidth, h = hero.offsetHeight, r = 12;
  const fh0 = Math.max(16, Math.min(30, w * 0.075));
  const [ht, hs, hb] = F.edges.map(k => k * fh0);

    if (len <= 0) return;

    let pos = 0, sx = off % sw;
    while (pos < L - .5){ const dw = Math.min(sw - sx, L - pos); c.drawImage(img, sx, fi * sh, dw, sh, pos, -sh, dw, sh); pos += dw; sx = 0; }

      const px = cx + (r - root) * Math.cos(phi), py = cy + (r - root) * Math.sin(phi);

  // 火星
  for (let i = 0; i < F.embers; i++){
    const ph = (i * 0.618) % 1, spd = .45 + (i * 0.37 % .45), u0 = (i * 0.414) % 1;
    const life = (t * spd + ph) % 1, sz = fh0 * (.18 + (i % 3) * .05) * (1 - .45 * life);
    let ex, ey;
    if (u0 < .6) { ex = x + r + (w - 2*r) * (u0 / .6); ey = y; }
    else if (u0 < .8) { ex = x - hs * .3; ey = y + h * .45 * ((u0 - .6) / .2); }
    else { ex = x + w + hs * .3; ey = y + h * .45 * ((u0 - .8) / .2); }
    ey -= fh0 * .3 + life * fh0 * 2.4; ex += 4 * Math.sin(t * 2.2 + ph * 6.283);
    const a = Math.sin(P * life);
    if (a < .03) continue;
    const g = c.createRadialGradient(ex, ey, 0, ex, ey, sz);
    g.addColorStop(0, `rgba(255,240,200,${a})`); g.addColorStop(.35, `rgba(255,150,40,${a * .8})`); g.addColorStop(1, 'rgba(255,60,0,0)');
    c.fillStyle = g; c.beginPath(); c.arc(ex, ey, sz, 0, 2 * P); c.fill();
  }
}

                    (C.carry_in ? `（${money(C.base)} + 之前滚入 ${money(C.carry_in)}）` : '') + `</div>`;
  if (T.short_last) h += `<div class="tklast">${esc(T.short_last.game)} · ${esc(T.short_last.date)} 不满 ${T.short_last.hours} 小时提前结束：没抽，${money(T.short_last.cash)} 滚入下一场，奖券都留着</div>`;

  (T.reserved || []).forEach(R => {
    h += `<div class="tklast">${esc(R.game)} · ${esc(R.date)} · ${esc(R.status)} · ${R.total} 张</div>`;
    h += `<div class="tkchips">${R.holders.map(x => `<span class="tkc">${esc(x.name)}<b>${x.n}</b></span>`).join('')}</div>`;
  });
  if (T.last){
    const L = T.last;
    h += `<div class="tklast">上次抽奖 · ${esc(L.game)} · ${esc(L.date)} · ` +
         (L.none ? `没有人符合条件，没有中奖者${L.cash ? '，' + money(L.cash) + ' 现金滚入下场' : ''}，奖券全部留到下场`
         : `#${L.picked} ${esc(L.who || '')} ` +

                : (L.award ? `不符合：${L.prize ? L.prize + '照发，' : ''}这张作废${L.cash ? '，' + money(L.cash) + ' 现金滚入下场' : ''}，其余奖券留到下场`

         (L.seal ? ` · 封存码 <span class="mono">${esc(L.seal)}</span>` : '') + `</div>`;

function showPinGate(p, box){
  let cached = null; try { cached = sessionStorage.getItem('pin_' + p.name); } catch(e){}
  if (cached) { revealPrivate(p, box, cached, true); return; }
  box.innerHTML =
    `<div class="pinbox">`+
      `<div class="pinhint">🔒 该玩家已隐藏徽章<br>输入<b>本人 PIN</b> 查看</div>`+
      `<input class="pinpw" id="pinIn" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off" enterkeyhint="go">`+
      `<button class="pinbtn" id="pinBtn">查看</button>`+
      `<div class="pinerr" id="pinErr"></div>`+
    `</div>`;
  const inp = document.getElementById('pinIn'), btn = document.getElementById('pinBtn');
  const go = () => revealPrivate(p, box, inp.value, false);
  btn.onclick = go;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  inp.focus();
}
async function revealPrivate(p, box, pin, fromCache){
  const blob = (DATA.private_badges || {})[p.name];
  if (!blob) { box.innerHTML = '<div class="pinhint">（暂无徽章数据）</div>'; return; }
  let obj;
  try { obj = await decryptBlob(blob, pin); }
  catch(e){
    try { sessionStorage.removeItem('pin_' + p.name); } catch(_){}
    if (fromCache) { showPinGate(p, box); return; }
    const err = document.getElementById('pinErr'); if (err) err.textContent = 'PIN 不正确，请重试';
    return;
  }
  try { sessionStorage.setItem('pin_' + p.name, pin); } catch(e){}
  document.getElementById('punlocked').textContent = `已解锁 ${obj.unlocked} / ${DATA.total_badges}`;
  renderTiers(document.getElementById('ptiers'), obj.badges || {});
  renderRefs(document.getElementById('prefs'), obj.referrals || []);
  renderBadges(box, obj.badges || {});
}
function closeSheet(){
  stopFire();
  document.getElementById('ov').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// ticket cell: '55 (+2)' — the part won in Full House draws in brackets
function tixCell(total, won){ total = total || 0; won = won || 0;
  return won ? `${total - won}<small class="fhw"> (+${won})</small>` : `${total}`; }

// Hi-res badge lightbox — tap a badge image to view the full-resolution art.
function openLb(bid){
  const b = (DATA.catalog || []).find(x => x.id === bid);
  if (!b) return;
  const pb = curBadges[bid] || {count:0, progress:''};
  const got = pb.count > 0;
  const img = document.getElementById('lbimg');
  img.src = b.img;
  img.className = b.rarity === 'legendary' ? 'lg' : (b.rarity === 'rare' ? 'rr' : '');
  document.getElementById('lbname').textContent = b.name + (pb.count > 1 ? `  ×${pb.count}` : '');
  const rc = document.getElementById('lbrarity');
  rc.className = 'chip ' + RC[b.rarity];
  rc.textContent = RL[b.rarity];
  document.getElementById('lbdesc').textContent = b.desc;
  const st = document.getElementById('lbstat');
  if (got){ st.className = 'lbstat done'; st.textContent = '✓ 已获得'; }
  else if (pb.progress){ st.className = 'lbstat prog'; st.textContent = '🔒 ' + pb.progress; }
  else { st.className = 'lbstat prog'; st.textContent = '🔒 未解锁'; }
  let wy = document.getElementById('lbwhy');
  if (!wy){ wy = document.createElement('div'); wy.id = 'lbwhy'; wy.className = 'lbwhy'; st.after(wy); }
  wy.textContent = (!got && pb.why) ? '⚠ ' + pb.why : '';
  const glow = b.rarity === 'legendary' ? 'rgba(255,199,0,.5)'
             : b.rarity === 'rare' ? 'rgba(90,200,250,.45)' : 'rgba(200,205,215,.34)';
  document.getElementById('lbox').style.setProperty('--glow', glow);
  document.getElementById('lbox').classList.add('open');
}
function closeLb(){ document.getElementById('lbox').classList.remove('open'); }

// If opened via a personal link (.../#p=<name>), jump straight to that sheet.
function openFromHash(){
  const m = location.hash.match(/^#p=(.+)$/);
  if (!m) return;
  let name; try { name = decodeURIComponent(m[1]); } catch(e){ return; }
  const p = BY_NAME[name];
  if (p) openPlayer(p);
}
